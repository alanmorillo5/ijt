[project]
name = "ijt"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "playwright>=1.40",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "weasyprint>=60.0",
    "httpx>=0.27",
    "rich>=13.0",
    "aiosqlite>=0.20",
    "playwright-stealth==2.0.3",
    "setuptools>=83.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "ruff>=0.3",
]

[project.scripts]
ijt = "ijt.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
